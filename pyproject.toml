[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symphony-claude"
version = "0.1.0"
description = "Service that orchestrates coding agents (Claude Code, headless) to deliver tracker-driven work."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "skwijeratne" }]
keywords = ["claude", "coding-agent", "orchestration", "linear", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "python-liquid>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/skwijeratne/symphony-claude"
Repository = "https://github.com/skwijeratne/symphony-claude"
Issues = "https://github.com/skwijeratne/symphony-claude/issues"
Specification = "https://github.com/skwijeratne/symphony-claude/blob/main/SPEC.md"

[project.scripts]
symphony = "symphony.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/packages/symphony"]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src/packages", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    # __all__ in exceptions.py is grouped by failure class (SPEC §14.1) for
    # readability rather than sorted alphabetically.
    "RUF022",
]

[tool.ruff.lint.flake8-tidy-imports]
# TECH.md: absolute imports only, no relative imports.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["symphony"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/packages/symphony", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
# Tests may omit return-type annotations on test functions for readability.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "liquid.*"
# Defensive: don't fail type-checking if python-liquid ships without type info.
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=symphony --cov-report=term-missing"
